[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vlm-tta"
version = "0.1.0"
description = "Budgeted visual test-time augmentation experiments for vision-language models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Iglovikov", email = "vladimir@albumentations.ai" }]
dependencies = []

[project.urls]
Repository = "https://github.com/ternaus/vlm-tta"
Issues = "https://github.com/ternaus/vlm-tta/issues"

[project.optional-dependencies]
dev = [
  "mypy>=2.3.0",
  "pre-commit>=4.6.0",
  "pyrefly>=1.3.0.dev3",
  "pytest>=9.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_tta"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["."]
ignore_missing_imports = false
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_reexport = true

[tool.pyrefly]
project-includes = ["src/vlm_tta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = ["--strict-config", "--strict-markers", "--tb=short", "-n=auto"]
