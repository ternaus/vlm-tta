name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - if: matrix.python-version == '3.13'
        run: uv run --locked --extra dev pre-commit run --all-files
      - if: hashFiles('tests/**/test_*.py') != ''
        run: uv run --locked --extra dev pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv venv --python 3.13 /tmp/vlm-tta-wheel-smoke
      - run: uv pip install --python /tmp/vlm-tta-wheel-smoke/bin/python dist/*.whl
      - run: /tmp/vlm-tta-wheel-smoke/bin/python -c "import vlm_tta"
